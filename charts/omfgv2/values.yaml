---
# Deliberately not configurable upwards without thought. DownloadManager keeps
# its job table in a plain in-memory Map and guards the queue with a
# process-local `downloading` flag, so a second replica does not share either:
# a client that POSTs /downloadTiles to one pod and then polls /queue/<id> gets
# a 404 from the other, and the "one download at a time" limit becomes one per
# pod. The cache PVC below is ReadWriteOnce on top of that.
replicaCount: 1

image:
  repository: ghcr.io/atgardner/omfgv2
  pullPolicy: IfNotPresent
  # Defaults to the chart's appVersion, which CI pins to the image tag that
  # matches this chart version. Override only to pin a different image.
  tag: ""

# Secrets in the release namespace holding registry credentials. The GHCR
# package is public, so this is only needed if you have made it private.
imagePullSecrets: []
#  - name: ghcr-pull-secret
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 3000

# Gateway API routing. Prefer this over `ingress` on clusters that have the
# Gateway API CRDs installed; enabling both is allowed but rarely wanted.
httpRoute:
  enabled: false
  annotations: {}
  # Gateways to attach to. Required when enabled — a route with no parent is
  # accepted by the API server and then silently routes nothing.
  parentRefs: []
  #  - name: my-gateway
  #    namespace: gateway-system
  #    sectionName: https
  # Omit to serve on every hostname the parent listener accepts.
  hostnames: []
  #  - omfg.example.com
  # Defaults to one rule sending every path to this chart's Service. Set this
  # to take over routing entirely — matches, filters, timeouts — in which case
  # you own the backendRefs too.
  rules: []

# Traditional Ingress, for clusters without the Gateway API.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: omfg.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: omfgv2-tls
  #    hosts:
  #      - omfg.example.com

# The app serves on 3000 and reads PORT from the environment.
containerPort: 3000

# Prometheus metrics, served on their own listener separate from the API —
# `ingress` and `httpRoute` send every path to the `http` port, so a /metrics
# route there would publish the server's internals along with the downloader.
#
# Off by default: nothing the app exports about itself is needed for it to
# work, so this is opt-in like every other optional block in this chart.
# Enabling it sets METRICS_ENABLED on the container, declares the port and
# adds it to the Service.
metrics:
  enabled: false
  # Read by the app as METRICS_PORT, and the port the Service exposes.
  port: 9091
  # Adds the prometheus.io/{scrape,path,port} pod annotations, for a Prometheus
  # that discovers targets by annotation. The port is rendered from
  # metrics.port above, so the two cannot drift.
  #
  # Also opt-in, and deliberately separate from `enabled`: exposing the port
  # changes nothing on its own, but these annotations make a Prometheus this
  # chart does not own start ingesting series and spending its storage. Worth
  # asking for explicitly.
  scrapeAnnotations: false
  # For the Prometheus Operator instead. Needs the ServiceMonitor CRD, so it
  # is off by default; enabling it without the CRD fails the install.
  serviceMonitor:
    enabled: false
    # Empty means inherit the Prometheus instance's own defaults.
    interval: ""
    scrapeTimeout: ""
    # Most operator deployments only select ServiceMonitors carrying a
    # particular label — check `spec.serviceMonitorSelector` on your Prometheus.
    labels: {}

# The tile cache. Every tile the app downloads is written to a per-source
# SQLite database under `cache/`, and re-used for a day before it is even
# revalidated — so without a volume here, replacing the pod throws away the
# work and re-downloads every tile from the upstream tile server on the next
# job. That is the one piece of state worth keeping, and it is why this block
# exists; it is off by default only because a chart should not provision
# storage nobody asked for.
persistence:
  enabled: false
  # Bind a PVC you manage yourself. Every provisioning field below is ignored
  # when this is set, and the chart creates no PVC of its own.
  existingClaim: ""
  # "" omits storageClassName entirely, so the cluster's default class applies.
  # A literal "-" sets it to the empty string, which disables dynamic
  # provisioning and binds a PV you created by hand.
  storageClass: ""
  # ReadWriteOnce is right for a single replica. Raising replicaCount with a
  # RWO claim leaves every pod after the first stuck in Pending, so the chart
  # refuses that combination rather than letting it fail at schedule time.
  accessModes:
    - ReadWriteOnce
  # Tiles are 5-15KB each and a job covers thousands of them across the zoom
  # range, so this fills faster than a log volume would. Nothing prunes it.
  size: 5Gi
  # The claim survives upgrades and pod restarts on its own — it is named after
  # the release and nothing re-provisions it. `helm uninstall` does delete it,
  # and the annotation below is what prevents that.
  #
  # Not on by default, because a kept claim then collides with a later
  # `helm install` of the same release name: Helm tries to create a PVC that is
  # already there and fails the whole install. Turn it on if losing the cache
  # to an uninstall matters more than that, and delete the claim by hand when
  # you really mean to.
  annotations: {}
  #  helm.sh/resource-policy: keep
  # Must match where the app actually writes. Cache paths are built as a
  # relative `cache/<source>` and the image's WORKDIR is /service, so this is
  # /service/cache. Pointing it elsewhere mounts a volume nothing ever writes
  # to, and the cache silently stays ephemeral.
  mountPath: /service/cache

# A freshly provisioned volume is owned by root, but the image runs as the
# unprivileged omfg user, so without a matching fsGroup the kubelet leaves the
# volume root unwritable and the very first tile write fails. This defaults to
# the GID the Dockerfile pins; the two have to agree, which is why that RUN
# line hard-codes 10001 rather than letting adduser pick.
#
# `OnRootMismatch` is what keeps that cheap. The default, `Always`, makes the
# kubelet recursively chown every file on the volume at each pod start — on a
# tile cache holding hundreds of thousands of files that turns a restart into
# minutes of disk churn. `OnRootMismatch` only walks the tree when the volume
# root's ownership is already wrong, so it costs nothing after the first
# mount.
podSecurityContext:
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch

resources: {}

# `/blah` returns a timestamp and is the closest thing to a health endpoint,
# but it is not one by contract, so both probes check the listening socket
# instead. Note that a download job runs on the same event loop as these:
# tile writes are synchronous SQLite calls, so keep the timeouts slack.
livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20
readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
