---
# Deliberately not configurable upwards without thought. DownloadManager keeps
# its job table in a plain in-memory Map and guards the queue with a
# process-local `downloading` flag, so a second replica does not share either:
# a client that POSTs /downloadTiles to one pod and then polls /queue/<id> gets
# a 404 from the other, and the "one download at a time" limit becomes one per
# pod. The claims below are ReadWriteOnce on top of that, and the output one
# is per-pod state besides: only the replica that ran a job holds its zip.
replicaCount: 1

image:
  repository: ghcr.io/atgardner/omfgv2
  pullPolicy: IfNotPresent
  # Defaults to the chart's appVersion, which CI pins to the image tag that
  # matches this chart version. Override only to pin a different image.
  tag: ""

# Secrets in the release namespace holding registry credentials. The GHCR
# package is public, so this is only needed if you have made it private.
imagePullSecrets: []
#  - name: ghcr-pull-secret
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 3000

# Gateway API routing. Prefer this over `ingress` on clusters that have the
# Gateway API CRDs installed; enabling both is allowed but rarely wanted.
httpRoute:
  enabled: false
  annotations: {}
  # Gateways to attach to. Required when enabled — a route with no parent is
  # accepted by the API server and then silently routes nothing.
  parentRefs: []
  #  - name: my-gateway
  #    namespace: gateway-system
  #    sectionName: https
  # Omit to serve on every hostname the parent listener accepts.
  hostnames: []
  #  - omfg.example.com
  # Defaults to one rule sending every path to this chart's Service. Set this
  # to take over routing entirely — matches, filters, timeouts — in which case
  # you own the backendRefs too.
  rules: []

# Traditional Ingress, for clusters without the Gateway API.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: omfg.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: omfgv2-tls
  #    hosts:
  #      - omfg.example.com

# The app serves on 3000 and reads PORT from the environment.
containerPort: 3000

# Read by the app as LOG_LEVEL. Empty leaves its default, `verbose`, which is
# the level a download job reports its progress at — the only account of a job
# that outlives the request that started it. Drop to `info` for the HTTP lines
# and job outcomes alone, or `warn`/`error` to quieten it further.
#
# A level winston does not know is ignored with a warning rather than silencing
# the logger, so a typo here costs you nothing but the level you asked for.
logLevel: ""

# Prometheus metrics, served on their own listener separate from the API —
# `ingress` and `httpRoute` send every path to the `http` port, so a /metrics
# route there would publish the server's internals along with the downloader.
#
# Off by default: nothing the app exports about itself is needed for it to
# work, so this is opt-in like every other optional block in this chart.
# Enabling it sets METRICS_ENABLED on the container, declares the port and
# adds it to the Service.
metrics:
  enabled: false
  # Read by the app as METRICS_PORT, and the port the Service exposes.
  port: 9091
  # Adds the prometheus.io/{scrape,path,port} pod annotations, for a Prometheus
  # that discovers targets by annotation. The port is rendered from
  # metrics.port above, so the two cannot drift.
  #
  # Also opt-in, and deliberately separate from `enabled`: exposing the port
  # changes nothing on its own, but these annotations make a Prometheus this
  # chart does not own start ingesting series and spending its storage. Worth
  # asking for explicitly.
  scrapeAnnotations: false
  # For the Prometheus Operator instead. Needs the ServiceMonitor CRD, so it
  # is off by default; enabling it without the CRD fails the install.
  serviceMonitor:
    enabled: false
    # Empty means inherit the Prometheus instance's own defaults.
    interval: ""
    scrapeTimeout: ""
    # Most operator deployments only select ServiceMonitors carrying a
    # particular label — check `spec.serviceMonitorSelector` on your Prometheus.
    labels: {}
  # Ships a Grafana dashboard for the series above, as a ConfigMap for the
  # Grafana sidecar to pick up. Needs no CRD and nothing installed in this
  # namespace — but it produces an object that a Grafana this chart does not
  # own will act on, so it is opt-in like `scrapeAnnotations`.
  #
  # Without the sidecar the ConfigMap is inert. Import
  # `dashboards/omfgv2.json` from the chart source by hand in that case; the
  # dashboard picks its Prometheus from a datasource variable either way.
  dashboard:
    enabled: false
    # What the sidecar selects on. The grafana chart's default is
    # `grafana_dashboard: "1"`, but both halves are configurable there — check
    # `sidecar.dashboards.label` and `.labelValue` on your Grafana.
    label: grafana_dashboard
    labelValue: "1"
    # Grafana folder to file the dashboard under, for a sidecar running in
    # folder-annotation mode. Empty leaves it to the sidecar's default folder.
    folder: ""

# Storage, one block per directory the app writes to. Both are off by default —
# a chart should not provision storage nobody asked for — and both are
# independent: enabling one says nothing about the other.
#
# The fields repeat, and mean the same thing in each block:
#
#   existingClaim  Bind a PVC you manage yourself. Every provisioning field is
#                  then ignored and the chart creates no PVC of its own.
#   storageClass   "" omits storageClassName entirely, so the cluster's default
#                  class applies. A literal "-" sets it to the empty string,
#                  which disables dynamic provisioning and binds a PV you
#                  created by hand.
#   accessModes    ReadWriteOnce is right for a single replica. Raising
#                  replicaCount with a RWO claim leaves every pod after the
#                  first stuck in Pending, so the chart refuses that
#                  combination rather than letting it fail at schedule time.
#   annotations    The claims survive upgrades and pod restarts on their own —
#                  they are named after the release and nothing re-provisions
#                  them. `helm uninstall` does delete them, and
#                  `helm.sh/resource-policy: keep` is what prevents that. Not
#                  set by default, because a kept claim then collides with a
#                  later `helm install` of the same release name: Helm tries to
#                  create a PVC that is already there and fails the whole
#                  install. Turn it on if losing the volume to an uninstall
#                  matters more than that, and delete the claim by hand when
#                  you really mean to.
#   mountPath      Must match where the app actually writes. Both paths are
#                  built relative to the image's WORKDIR, /service, so moving
#                  one mounts a volume nothing ever writes to and leaves that
#                  directory silently ephemeral.
persistence:
  # The tile cache. Every tile the app downloads is written to a per-source
  # SQLite database under `cache/`, and re-used for a day before it is even
  # revalidated — so without a volume here, replacing the pod throws away the
  # work and re-downloads every tile from the upstream tile server on the next
  # job.
  cache:
    enabled: false
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    # Tiles are 5-15KB each and a job covers thousands of them across the zoom
    # range, so this fills faster than a log volume would. Nothing prunes it.
    size: 5Gi
    annotations: {}
    #  helm.sh/resource-policy: keep
    mountPath: /service/cache
  # The packaged results. A finished job writes a zip to `output/` and reports
  # a URL that `GET /output/<file>` serves it from — the only way the file
  # leaves the container. Without a volume here, replacing the pod between
  # "Done" and the client's download loses the zip, and the client's only way
  # back to it is to run the whole job again.
  output:
    enabled: false
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    # A packaged route is tens to hundreds of MB, against a cache measured in
    # whole tile pyramids — so this is smaller than the cache above by design.
    # Nothing prunes it either, and unlike the cache, nothing here is worth
    # keeping once the client has its copy.
    size: 2Gi
    annotations: {}
    #  helm.sh/resource-policy: keep
    mountPath: /service/output

# Retention. Nothing else ever removes either half of what a job leaves behind:
# its entry sits in an in-memory table from the moment it finishes, and its zip
# sits on the output volume from the moment it is written. A sweep runs on the
# interval below and once at startup — and the startup pass is the one that
# matters, because a restart empties the table and leaves every file on the
# volume with no job to claim it.
retention:
  # The app prunes unless this says otherwise, so a run without this chart
  # still tidies up after itself — hence the env var is set either way. Turning
  # it off keeps every job and every file for ever, which is a volume you have
  # to watch yourself.
  enabled: true
  # How long a finished job keeps its entry and its zip. This is the window a
  # client has to collect its download, and `/queue/<id>` answers for exactly
  # as long — so it is the number to raise if somebody starts a job in the
  # evening and fetches it the next morning.
  jobTtlHours: 24
  # The age at which a file with no job to claim it is deleted, which after a
  # pod is replaced mid-job is every file on the volume. Longer than
  # jobTtlHours by a wide margin on purpose: a job's own zip is minutes to
  # hours old while it is being written, and this rule must never be what
  # deletes it.
  outputTtlDays: 7
  # How often the sweep runs, on top of the one at startup. It is a readdir and
  # a stat per file, so this is cheap; there is just rarely anything to do.
  intervalMinutes: 60

# A freshly provisioned volume is owned by root, but the image runs as the
# unprivileged omfg user, so without a matching fsGroup the kubelet leaves the
# volume root unwritable and the very first tile write fails. This defaults to
# the GID the Dockerfile pins; the two have to agree, which is why that RUN
# line hard-codes 10001 rather than letting adduser pick.
#
# `OnRootMismatch` is what keeps that cheap. The default, `Always`, makes the
# kubelet recursively chown every file on the volume at each pod start — on a
# tile cache holding hundreds of thousands of files that turns a restart into
# minutes of disk churn. `OnRootMismatch` only walks the tree when the volume
# root's ownership is already wrong, so it costs nothing after the first
# mount.
podSecurityContext:
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch

resources: {}

# Real HTTP probes, which is what makes them depend on the event loop: the
# tcpSocket probes these replace were answered by the kernel's accept queue and
# passed even when nothing in the process could run. A download job's tile
# writes are synchronous SQLite calls on that same loop, so the timeouts and
# thresholds here are deliberately slack -- liveness needs roughly 75s of
# unresponsiveness before it restarts the pod, and a restart takes the running
# job with it.
#
# /healthz checks nothing but its own ability to answer, on purpose: a probe
# that failed on an unwritable volume or an unreachable tile server would
# restart a pod that a restart cannot fix.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3
# /readyz additionally fails while the pod is draining after SIGTERM, and when
# a data directory is not writable -- the fsGroup mistake described above then
# shows up as a pod that never goes ready, instead of as a failed tile write an
# hour into a download.
#
# Deliberately not tied to whether a job is running: this chart runs a single
# replica, and going unready mid-job would pull it out of the Service and break
# the `/queue/:id` polling of the very client waiting on that job.
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
