---
# The two mounts are the point of this chart, and every way of getting them
# wrong still renders valid YAML: a volume with no mount, a mount at a path the
# app never writes to, or a rolling update that deadlocks on the volume.
suite: deployment
templates:
  - deployment.yaml
release:
  name: test-release
tests:
  - it: renders a deployment with the chart's image and port
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: test-release-omfgv2
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/atgardner/omfgv2:latest
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 3000

  # values.yaml leaves image.tag empty so the chart deploys the appVersion CI
  # pinned to this exact build; an explicit tag has to win over it.
  - it: prefers an explicit image tag over appVersion
    set:
      image.tag: main-abc1234
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/atgardner/omfgv2:main-abc1234

  # The app reads PORT, so a containerPort that the env does not match would
  # leave the Service pointing at a port nothing listens on.
  - it: passes containerPort through to PORT
    set:
      containerPort: 8080
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0]
          value:
            name: PORT
            value: "8080"
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080

  # Absent rather than empty: an empty LOG_LEVEL is a value the app would have
  # to treat as "unset" itself, and the chart has no reason to make it.
  - it: sets no log level by default
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 7

  - it: passes logLevel through when set
    set:
      logLevel: info
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[7]
          value:
            name: LOG_LEVEL
            value: info

  # The app prunes unless RETENTION_ENABLED says otherwise, so an unset
  # variable would leave `enabled: false` doing nothing — the same trap as
  # METRICS_ENABLED, and the reason both are rendered either way.
  - it: passes the retention settings through as env vars
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[3]
          value:
            name: RETENTION_ENABLED
            value: "true"
      - equal:
          path: spec.template.spec.containers[0].env[4]
          value:
            name: JOB_TTL_HOURS
            value: "24"
      - equal:
          path: spec.template.spec.containers[0].env[5]
          value:
            name: OUTPUT_TTL_DAYS
            value: "7"
      - equal:
          path: spec.template.spec.containers[0].env[6]
          value:
            name: PRUNE_INTERVAL_MINUTES
            value: "60"

  - it: turns retention off without dropping the other settings
    set:
      retention.enabled: false
      retention.jobTtlHours: 6
      retention.outputTtlDays: 2
      retention.intervalMinutes: 15
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[3]
          value:
            name: RETENTION_ENABLED
            value: "false"
      - equal:
          path: spec.template.spec.containers[0].env[4]
          value:
            name: JOB_TTL_HOURS
            value: "6"
      - equal:
          path: spec.template.spec.containers[0].env[5]
          value:
            name: OUTPUT_TTL_DAYS
            value: "2"
      - equal:
          path: spec.template.spec.containers[0].env[6]
          value:
            name: PRUNE_INTERVAL_MINUTES
            value: "15"

  # The app serves metrics unless METRICS_ENABLED says otherwise, so an unset
  # variable here would leave a listener running on a port the chart never
  # declared and the Service never exposed. That is why it is rendered either
  # way rather than only when metrics are on.
  - it: declares no metrics port by default and tells the app to stay quiet
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[1]
          value:
            name: METRICS_ENABLED
            value: "false"
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 1
      - notExists:
          path: spec.template.metadata.annotations

  - it: drives the metrics port and env vars from metrics.port when enabled
    set:
      metrics.enabled: true
      metrics.port: 9099
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[1]
          value:
            name: METRICS_ENABLED
            value: "true"
      - equal:
          path: spec.template.spec.containers[0].env[2]
          value:
            name: METRICS_PORT
            value: "9099"
      - equal:
          path: spec.template.spec.containers[0].ports[1]
          value:
            name: metrics
            containerPort: 9099
            protocol: TCP

  # Exposing the port and asking a Prometheus to scrape it are separate
  # decisions, so the annotations must not ride along with metrics.enabled.
  - it: adds no scrape annotations unless they are asked for
    set:
      metrics.enabled: true
    asserts:
      - notExists:
          path: spec.template.metadata.annotations

  # The annotation port is rendered from metrics.port, so a scrape aimed at a
  # port nothing listens on is not a state this chart can reach.
  - it: annotates the pod for scrape discovery alongside podAnnotations
    set:
      metrics.enabled: true
      metrics.port: 9099
      metrics.scrapeAnnotations: true
      podAnnotations:
        team: maps
    asserts:
      - equal:
          path: spec.template.metadata.annotations
          value:
            team: maps
            prometheus.io/scrape: "true"
            prometheus.io/path: /metrics
            prometheus.io/port: "9099"

  # Annotations are pointless without a listener to point at, and the pod would
  # otherwise advertise a port the container does not open.
  - it: leaves scrape annotations off when metrics are disabled
    set:
      metrics.scrapeAnnotations: true
    asserts:
      - notExists:
          path: spec.template.metadata.annotations

  - it: mounts no volume by default
    asserts:
      - notExists:
          path: spec.template.spec.volumes
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts

  # The paths are a contract with the app, which builds both relative to the
  # image's WORKDIR: `cache/<source>` for tiles and `output/` for the packaged
  # zip that GET /output/:file then serves.
  - it: mounts the cache claim it provisions
    set:
      persistence.cache.enabled: true
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 1
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0]
          value:
            name: cache
            mountPath: /service/cache
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: test-release-omfgv2

  # Independently of the cache: a deployment that keeps its tile cache but
  # loses a finished zip on every restart is the case this volume exists for.
  - it: mounts the output claim on its own
    set:
      persistence.output.enabled: true
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 1
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0]
          value:
            name: output
            mountPath: /service/output
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: test-release-omfgv2-output

  - it: mounts both volumes when both are enabled
    set:
      persistence.cache.enabled: true
      persistence.output.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: cache
              mountPath: /service/cache
            - name: output
              mountPath: /service/output
      - equal:
          path: spec.template.spec.volumes[1].name
          value: output

  - it: mounts an existing claim by name
    set:
      persistence.cache.enabled: true
      persistence.cache.existingClaim: my-cache
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: my-cache

  # RollingUpdate plus a ReadWriteOnce volume deadlocks: the new pod cannot
  # attach while the outgoing one still holds it.
  - it: switches to Recreate when a volume is mounted
    set:
      persistence.cache.enabled: true
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: switches to Recreate for the output volume too
    set:
      persistence.output.enabled: true
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: leaves the default strategy alone without a volume
    asserts:
      - notExists:
          path: spec.strategy

  - it: merges podLabels into the pod without disturbing the selector
    set:
      podLabels:
        tier: web
    asserts:
      - equal:
          path: spec.template.metadata.labels["tier"]
          value: web
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: omfgv2
      - notExists:
          path: spec.selector.matchLabels["tier"]

  # The image runs as uid/gid 10001, so a volume the kubelet leaves owned by
  # root is unwritable and the first tile write fails. The GID here and the one
  # the Dockerfile pins have to stay in step.
  - it: defaults to an fsGroup matching the image's user
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 10001
      - equal:
          path: spec.template.spec.securityContext.fsGroupChangePolicy
          value: OnRootMismatch

  # `null`, not `{}`. Helm merges values rather than replacing them, so an
  # empty map leaves the defaults above in place and only an explicit null
  # drops the block — worth pinning, because the `{}` that looks like it should
  # work silently does nothing.
  - it: omits the security context when explicitly nulled
    set:
      podSecurityContext: null
    asserts:
      - notExists:
          path: spec.template.spec.securityContext

  - it: allows the security context to be replaced
    set:
      podSecurityContext:
        fsGroup: 2000
        runAsNonRoot: true
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 2000
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  # The paths are a contract with index.ts, and the port name with the ports
  # block above — a probe pointing at a path the app does not serve fails
  # closed, restarting a healthy pod on a loop.
  - it: probes the app's health endpoints over HTTP
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
          value:
            path: /healthz
            port: http
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
          value:
            path: /readyz
            port: http

  # A download job's synchronous SQLite writes share the event loop with these
  # handlers, so the slack is the point: at 1s — the kubelet's default, which
  # is what omitting timeoutSeconds would mean — a busy job would restart the
  # pod it is running in.
  - it: keeps the probe timeouts slack enough for a running job
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 5
      - equal:
          path:
            spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 3
