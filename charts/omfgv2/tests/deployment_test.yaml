---
# The cache mount is the point of this chart, and every way of getting it wrong
# still renders valid YAML: a volume with no mount, a mount at a path the app
# never writes to, or a rolling update that deadlocks on the volume.
suite: deployment
templates:
  - deployment.yaml
release:
  name: test-release
tests:
  - it: renders a deployment with the chart's image and port
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: test-release-omfgv2
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/atgardner/omfgv2:latest
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 3000

  # values.yaml leaves image.tag empty so the chart deploys the appVersion CI
  # pinned to this exact build; an explicit tag has to win over it.
  - it: prefers an explicit image tag over appVersion
    set:
      image.tag: main-abc1234
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/atgardner/omfgv2:main-abc1234

  # The app reads PORT, so a containerPort that the env does not match would
  # leave the Service pointing at a port nothing listens on.
  - it: passes containerPort through to PORT
    set:
      containerPort: 8080
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0]
          value:
            name: PORT
            value: "8080"
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080

  - it: mounts no volume by default
    asserts:
      - notExists:
          path: spec.template.spec.volumes
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts

  - it: mounts the cache claim it provisions
    set:
      persistence.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0]
          value:
            name: cache
            mountPath: /service/cache
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: test-release-omfgv2

  - it: mounts an existing claim by name
    set:
      persistence.enabled: true
      persistence.existingClaim: my-cache
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: my-cache

  # RollingUpdate plus a ReadWriteOnce volume deadlocks: the new pod cannot
  # attach while the outgoing one still holds it.
  - it: switches to Recreate when a volume is mounted
    set:
      persistence.enabled: true
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: leaves the default strategy alone without a volume
    asserts:
      - notExists:
          path: spec.strategy

  - it: merges podLabels into the pod without disturbing the selector
    set:
      podLabels:
        tier: web
    asserts:
      - equal:
          path: spec.template.metadata.labels["tier"]
          value: web
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: omfgv2
      - notExists:
          path: spec.selector.matchLabels["tier"]

  # The image runs as uid/gid 10001, so a volume the kubelet leaves owned by
  # root is unwritable and the first tile write fails. The GID here and the one
  # the Dockerfile pins have to stay in step.
  - it: defaults to an fsGroup matching the image's user
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 10001
      - equal:
          path: spec.template.spec.securityContext.fsGroupChangePolicy
          value: OnRootMismatch

  # `null`, not `{}`. Helm merges values rather than replacing them, so an
  # empty map leaves the defaults above in place and only an explicit null
  # drops the block — worth pinning, because the `{}` that looks like it should
  # work silently does nothing.
  - it: omits the security context when explicitly nulled
    set:
      podSecurityContext: null
    asserts:
      - notExists:
          path: spec.template.spec.securityContext

  - it: allows the security context to be replaced
    set:
      podSecurityContext:
        fsGroup: 2000
        runAsNonRoot: true
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 2000
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
