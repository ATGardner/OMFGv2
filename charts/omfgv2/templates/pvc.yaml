{{/*
One claim per enabled volume: the tile cache, the packaged output, or both.
They are provisioned separately rather than as one volume with two subPaths so
that a cache measured in tile pyramids and an output directory holding a job or
two can be sized — and thrown away — independently.
*/}}
{{- $volumes := dict "cache" .Values.persistence.cache "output" .Values.persistence.output }}
{{/*
Fails the render rather than the schedule. A ReadWriteOnce claim binds to a
single node, so a second replica sits Pending indefinitely with an event nobody
reads. Only checked for claims this chart provisions — an existingClaim's real
access modes live on that object, not in these values.
*/}}
{{- range $name, $volume := $volumes }}
{{- if and $volume.enabled (not $volume.existingClaim) (gt (int $.Values.replicaCount) 1) (not (has "ReadWriteMany" $volume.accessModes)) }}
{{- fail (printf "persistence.%s.accessModes must include ReadWriteMany when replicaCount > 1" $name) }}
{{- end }}
{{- end }}
{{- range $name, $volume := $volumes }}
{{- if and $volume.enabled (not $volume.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "omfgv2.claimName" (dict "root" $ "name" $name) }}
  labels:
    {{- include "omfgv2.labels" $ | nindent 4 }}
  {{- with $volume.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml $volume.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ $volume.size | quote }}
  {{- with $volume.storageClass }}
  {{- if eq . "-" }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
