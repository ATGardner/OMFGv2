---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omfgv2.fullname" . }}
  labels:
    {{- include "omfgv2.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.persistence.enabled }}
  {{/*
  A ReadWriteOnce volume can only be attached to one node, and the default
  RollingUpdate keeps the old pod running while the new one starts — so an
  upgrade deadlocks, the new pod Pending on a volume the outgoing pod still
  holds. Recreate takes the brief downtime instead, which for a single-replica
  batch downloader costs nothing.

  The volume itself is untouched either way: the claim is named after the
  release and neither an upgrade nor a pod restart re-provisions it, so the
  tile cache survives both. Only `helm uninstall` removes it — see the
  resource-policy note in values.yaml.
  */}}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "omfgv2.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- $scrapeAnnotations := dict }}
      {{- if and .Values.metrics.enabled .Values.metrics.scrapeAnnotations }}
      {{- $scrapeAnnotations = dict "prometheus.io/scrape" "true" "prometheus.io/path" "/metrics" "prometheus.io/port" (.Values.metrics.port | toString) }}
      {{- end }}
      {{- with merge (deepCopy (.Values.podAnnotations | default dict)) $scrapeAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "omfgv2.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "omfgv2.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.containerPort | quote }}
            # Set either way rather than only when enabled: the app defaults to
            # serving metrics when this is unset, so leaving it off would run a
            # listener the chart never declared or exposed.
            - name: METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            {{- with .Values.logLevel }}
            # Only when set, unlike the metrics pair above: the app's default
            # is the one this chart wants, so there is nothing to override
            # until someone asks for a different level.
            - name: LOG_LEVEL
              value: {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: cache
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "omfgv2.fullname" .) }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
